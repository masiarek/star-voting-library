scenario_description: >-
  The STAR race of Equal Vote's public US 2024 Presidential poll on BetterVoting (election
  pres24), 2,772 ballots, 8 candidates. Imported to ask one question: does it matter that 14% of
  ballots never used both ends of the 0-5 scale? It does not. The scoring leader here is also the
  Condorcet winner - she beats all seven rivals head to head - so the runoff returns her against
  any finalist. Blanks are tabulated as 0, exactly as BetterVoting does. Note BetterVoting drops
  the 7 ballots that score every candidate identically before totalling, so its score column reads
  10 points lower for every candidate; no comparison, runoff or winner is affected.
