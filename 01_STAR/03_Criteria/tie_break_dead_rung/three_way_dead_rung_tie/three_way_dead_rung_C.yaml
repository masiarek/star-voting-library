election_title: 'Three-way dead-rung tie — published order C,A,B elects C'

scenario_description: |-
  The SAME rotationally-symmetric three-candidate dead-rung tie as
  three_way_dead_rung_A.yaml (A 4/0/0, B 0/4/0, C 0/0/4 — totals 4-4-4, all
  pairwise 1-1, no 5s so the five-star rung is dead). Only the lot order changes:
  here it is [C, A, B], so C wins. Same ballots as _A (elects A) and _B (elects
  B): three candidates, three possible winners, chosen entirely by the lot order.

  Like _B, this file is a COUNTERFACTUAL and carries no BV election id on
  purpose. The ballots are live on BetterVoting as BV2285 (vx89hj), where the
  seeded shuffle drew A, B, C and elected A. C never got its turn — not because
  the voters ruled it out (they scored it exactly what they scored the other
  two) but because the draw put it third. That is the whole argument for a
  deterministic, pre-published lot: it fixes the order in advance instead of
  discovering it at count time. See the lesson md and BV #1063.

num_winners: 1
voting_method: STAR
lot_numbers: [C, A, B]
ballots: |-
  A,B,C
  4,0,0
  0,4,0
  0,0,4

expected_winners:
  - C

