# MkDocs Material site for the whole repo — publishes every Markdown page (teaching
# docs + the generated per-election pages) as a searchable website on GitHub Pages.
#
#   Local preview:  uvx --with mkdocs-same-dir --with mkdocs-material --with mkdocs-redirects mkdocs serve
#   Deploy:         .github/workflows/docs.yml builds on every push to master
#                   (one-time setup: repo Settings → Pages → Source: GitHub Actions)
#
# The docs root IS the repo root (mkdocs-same-dir), so there is no docs/ copy step:
# the same Markdown that GitHub renders is what the site serves, and non-Markdown
# files (.yaml sources, _tabulated .txt mirrors) are copied through so links to
# them keep working.

site_name: STAR Voting — Education & Test-Case Library
site_description: Learn, teach, and debate STAR Voting — every claim backed by a runnable YAML election.
site_url: https://masiarek.github.io/star-voting-library/
repo_url: https://github.com/masiarek/star-voting-library
repo_name: masiarek/star-voting-library
edit_uri: edit/master/

docs_dir: .
site_dir: site

# The repo's cross-links were authored for GitHub's file-relative rendering
# (including links to bare folders, which resolve to the folder's README.md).
# Plain .html pages keep those exact semantics; pretty directory URLs would
# shift every page one level deeper and 404 the folder-style links.
use_directory_urls: false

# Built and linkable, but hidden from the auto-generated left sidebar — internal
# or duplicate pages that would otherwise greet a newcomer at the very top of
# the nav: CLAUDE.md (house conventions), the license inventory, and readme.md
# (whose content already IS the homepage — index.md inlines it at build time).
not_in_nav: |
  /CLAUDE.md
  /THIRD_PARTY_LICENSES.md
  /readme.md

theme:
  name: material
  icon:
    logo: material/star-circle
  features:
    - navigation.indexes    # a folder's README.md becomes its section landing page
    - navigation.prune      # don't embed the full 700-page nav in every page
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - 00_start_here/about_this_repo/site_extra.css

plugins:
  - search
  - same-dir
  # Site-only URL redirects. The source .md keeps its content on disk (GitHub's
  # folder view still renders it in full); only the BUILT page at that URL is
  # replaced by a redirect stub. Use sparingly — a redirected folder README is
  # unreachable on the site, so whatever it said must live at the destination.
  - redirects:
      redirect_maps:
        # (A redirect from 05_Ranked_Robin/README.md to the Ranked Robin method
        # page used to live here, back when that method page sat in a separate
        # 00_start_here tree and the case folder was the only top-level door.
        # The reorganization below moved the concepts INTO 05_Ranked_Robin, so
        # the folder's own README is now the method front door in the right
        # place and the redirect would only push readers past it. Retired.)

        # --- Concept pages relocated from 00_start_here into their method
        # folders (the "one door per method" reorganization). Every moved page
        # keeps a redirect FOREVER: published URLs are quoted in permanent
        # BetterVoting election descriptions, which cannot be edited after the
        # election goes live, so a 404 here is unfixable. Never delete these.
        00_start_here/Range_Voting/README.md: 06_Other/Range/concepts/README.md
        00_start_here/Range_Voting/glossary_range.md: 06_Other/Range/concepts/glossary_range.md
        00_start_here/Range_Voting/range_voting.md: 06_Other/Range/concepts/range_voting.md
        00_start_here/other_ranked_methods/agenda_voting.md: 06_Other/other_ranked_methods/agenda_voting.md
        00_start_here/other_ranked_methods/borda.md: 06_Other/other_ranked_methods/borda.md
        00_start_here/proportional_representation/README.md: 03_STAR_PR/concepts/README.md
        00_start_here/proportional_representation/STAR_PR/README.md: 03_STAR_PR/concepts/STAR_PR/README.md
        00_start_here/proportional_representation/STAR_PR/the_math_behind_proportional_star.md: 03_STAR_PR/concepts/STAR_PR/the_math_behind_proportional_star.md
        00_start_here/proportional_representation/stv/proportional_stv_vs_star.md: 03_STAR_PR/concepts/stv/proportional_stv_vs_star.md
        00_start_here/Approval_Voting/Multiwinner_Approval/README.md: 04_Approval/concepts/Multiwinner_Approval/README.md
        00_start_here/Approval_Voting/Multiwinner_Approval/abc_rules_intro.md: 04_Approval/concepts/Multiwinner_Approval/abc_rules_intro.md
        00_start_here/Approval_Voting/Multiwinner_Approval/abc_rules_spectrum.md: 04_Approval/concepts/Multiwinner_Approval/abc_rules_spectrum.md
        00_start_here/Approval_Voting/Multiwinner_Approval/approval_multiwinner.md: 04_Approval/concepts/Multiwinner_Approval/approval_multiwinner.md
        00_start_here/Approval_Voting/Multiwinner_Approval/thiele_methods.md: 04_Approval/concepts/Multiwinner_Approval/thiele_methods.md
        00_start_here/Approval_Voting/README.md: 04_Approval/concepts/README.md
        00_start_here/Approval_Voting/approval_honest_limits.md: 04_Approval/concepts/approval_honest_limits.md
        00_start_here/Approval_Voting/approval_in_the_literature.md: 04_Approval/concepts/approval_in_the_literature.md
        00_start_here/Approval_Voting/approval_top_two.md: 04_Approval/concepts/approval_top_two.md
        00_start_here/Approval_Voting/approval_voting.md: 04_Approval/concepts/approval_voting.md
        00_start_here/Approval_Voting/glossary_approval.md: 04_Approval/concepts/glossary_approval.md
        00_start_here/Approval_Voting/hamlin_hua_2023.md: 04_Approval/concepts/hamlin_hua_2023.md
        00_start_here/RCV_Ranked_Robin/RCV_RR_honest_limits.md: 05_Ranked_Robin/concepts/RCV_RR_honest_limits.md
        00_start_here/RCV_Ranked_Robin/RCV_RR_summability.md: 05_Ranked_Robin/concepts/RCV_RR_summability.md
        00_start_here/RCV_Ranked_Robin/README.md: 05_Ranked_Robin/concepts/README.md
        00_start_here/RCV_Ranked_Robin/condorcet_naming_decoder.md: 05_Ranked_Robin/concepts/condorcet_naming_decoder.md
        00_start_here/RCV_Ranked_Robin/cycle_resolution.md: 05_Ranked_Robin/concepts/cycle_resolution.md
        00_start_here/RCV_Ranked_Robin/glossary_ranked_robin.md: 05_Ranked_Robin/concepts/glossary_ranked_robin.md
        00_start_here/RCV_Ranked_Robin/ranked_robin.md: 05_Ranked_Robin/concepts/ranked_robin.md
        00_start_here/RCV_Ranked_Robin/ranked_robin_vs_condorcet.md: 05_Ranked_Robin/concepts/ranked_robin_vs_condorcet.md
        00_start_here/RCV_Ranked_Robin/ranked_robin_vs_consensus_choice.md: 05_Ranked_Robin/concepts/ranked_robin_vs_consensus_choice.md
        00_start_here/RCV_Ranked_Robin/rr_blank_means_last.md: 05_Ranked_Robin/concepts/rr_blank_means_last.md
        00_start_here/RCV_Ranked_Robin/rr_clone_independence.md: 05_Ranked_Robin/concepts/rr_clone_independence.md
        00_start_here/RCV_Ranked_Robin/rr_tiebreak_lh_vs_bv.md: 05_Ranked_Robin/concepts/rr_tiebreak_lh_vs_bv.md
        00_start_here/RCV_Ranked_Robin/the_math_behind_condorcet.md: 05_Ranked_Robin/concepts/the_math_behind_condorcet.md
        00_start_here/RCV_Ranked_Robin/why_ranked_robin.md: 05_Ranked_Robin/concepts/why_ranked_robin.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# docs_dir is the repo root, so keep non-content out of the site.
# NOTE: setting exclude_docs replaces MkDocs' built-in default — the `.*` line
# (dot-files/dirs: .git, .venv, .claude, .idea, …) must stay first.
exclude_docs: |
  .*
  /site
  /AGENTS.md
  /pets.html
  /ballots.pdf
  /todo-*.md
  _demo_dropbox/
  _generated/
  __pycache__/
