  # GitHub (LINKS.md's registry tables above all) rendered their URL column as
  # dead plain text on the site. MagicLink restores GitHub's behaviour. Left at
  # defaults on purpose: repo_url_shorthand/social_url_shorthand stay off, so
  # `#123` and `@name` in prose are never silently turned into links.
  - pymdownx.magiclink
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# docs_dir is the repo root, so keep non-content out of the site.
# NOTE: setting exclude_docs replaces MkDocs' built-in default — the `.*` line
# (dot-files/dirs: .git, .venv, .claude, .idea, …) must stay first.
exclude_docs: |
  .*
  /site
  /AGENTS.md
  /mkdocs_hooks.py
  /ballots.pdf
  /_notes
  _demo_dropbox/
  _generated/
  __pycache__/
