# MkDocs Material site for the whole repo — publishes every Markdown page (teaching
# docs + the generated per-election pages) as a searchable website on GitHub Pages.
#
#   Local preview:  uv run --group docs mkdocs serve
#                   (toolchain pinned in pyproject.toml [dependency-groups].docs + uv.lock)
#   Deploy:         .github/workflows/docs.yml builds on every push to master
#                   (one-time setup: repo Settings → Pages → Source: GitHub Actions)
#
# The docs root IS the repo root (mkdocs-same-dir), so there is no docs/ copy step:
# the same Markdown that GitHub renders is what the site serves, and non-Markdown
# files (.yaml sources, _tabulated .txt mirrors) are copied through so links to
# them keep working.

site_name: STAR Voting — Education & Test-Case Library
site_description: Learn, teach, and debate STAR Voting — every claim backed by a runnable YAML election.
site_url: https://masiarek.github.io/star-voting-library/
repo_url: https://github.com/masiarek/star-voting-library
repo_name: masiarek/star-voting-library
edit_uri: edit/master/

docs_dir: .
site_dir: site

# The repo's cross-links were authored for GitHub's file-relative rendering
# (including links to bare folders, which resolve to the folder's README.md).
# Plain .html pages keep those exact semantics; pretty directory URLs would
# shift every page one level deeper and 404 the folder-style links.
use_directory_urls: false

# Built and linkable, but hidden from the auto-generated left sidebar.
#
# Two groups. First, internal or duplicate pages that would otherwise greet a
# newcomer at the very top of the nav: CLAUDE.md (house conventions), the
# license inventory, and readme.md (whose content already IS the homepage —
# index.md inlines it at build time).
#
# Second, and much larger: the GENERATED per-election pages in `*_pages/`. There
# are 456 of them against ~650 hand-written pages, so left in the sidebar they
# are the clear majority of it — and they are the one part of the library nobody
# navigates by scrolling. You reach a case from its folder README (every one is
# index-complete, enforced by check_repo_hygiene) or from CATALOG.md, both of
# which say what each case *teaches*; the sidebar can only offer the filename.
# The pages are still BUILT, still linked, still at the same URLs — only absent
# from the nav tree, exactly as they are already absent from the search index
# (`search: exclude: true`, stamped by build_yaml_pages.py for the same reason:
# they were 44% of a 9 MB index).
#
# The one thing this costs: MkDocs derives the footer's prev/next arrows from
# the nav, so a case page no longer has them. That loss is already covered in
# the page body — build_yaml_pages.py ends every generated page with a "More
# cases in this set" list naming every sibling, above "See also" links to the
# folder README, the topic hubs, the glossary and the by-method index. Sibling
# traversal moved from the chrome into the content; it did not disappear. If
# that footer block is ever dropped from the generator, revisit this exclusion.
#
# Keep the nav and search exclusions in sync. If a future generator writes pages
# somewhere other than `*_pages/`, it needs a pattern here too, or 400-odd
# filenames reappear in the sidebar.
not_in_nav: |
  /CLAUDE.md
  /CONTRIBUTING.md
  /THIRD_PARTY_LICENSES.md
  /readme.md
  *_pages/

theme:
  name: material
  icon:
    logo: material/star-circle
  features:
    - navigation.indexes    # a folder's README.md becomes its section landing page
    - navigation.prune      # don't embed the full 700-page nav in every page
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - 07_Concepts/about_this_repo/site_extra.css

# Local build-time fixes that would otherwise need a plugin (and therefore a new
# pinned dependency). Currently: acronym casing in the auto-generated sidebar
# labels, which MkDocs derives from folder names — see the module docstring.
hooks:
  - mkdocs_hooks.py

plugins:
  - search
  - same-dir
  # Site-only URL redirects. The source .md keeps its content on disk (GitHub's
  # folder view still renders it in full); only the BUILT page at that URL is
  # replaced by a redirect stub. Use sparingly — a redirected folder README is
  # unreachable on the site, so whatever it said must live at the destination.
  - redirects:
      redirect_maps:
        # (A redirect from 05_Ranked_Robin/README.md to the Ranked Robin method
        # page used to live here, back when that method page sat in a separate
        # 00_start_here tree and the case folder was the only top-level door.
        # The reorganization below moved the concepts INTO 05_Ranked_Robin, so
        # the folder's own README is now the method front door in the right
        # place and the redirect would only push readers past it. Retired.)

