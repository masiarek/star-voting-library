markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# docs_dir is the repo root, so keep non-content out of the site.
# NOTE: setting exclude_docs replaces MkDocs' built-in default — the `.*` line
# (dot-files/dirs: .git, .venv, .claude, .idea, …) must stay first.
exclude_docs: |
  .*
  /site
  /AGENTS.md
  /mkdocs_hooks.py
  /ballots.pdf
  /_notes
  _demo_dropbox/
  _generated/
  __pycache__/
