election_title: "BV2270 — the two-way Copeland tie that showed the engine was starting the ladder one rung too low"
scenario_description: >-
  Nine voters rank four trees for a street-planting commission, and the count lands on the
  middle rung of the Ranked Robin tiebreak ladder — the rung the other cases in this folder
  fall straight past. Alder and Birch finish level on pairwise wins: Alder beats Birch and
  Cedar but loses to Dogwood; Birch beats Cedar and Dogwood but loses to Alder. Two wins
  each, Copeland 2. Cedar and Dogwood take one each.

  A tie of exactly two used to be where LH and BetterVoting parted company, and this file is
  the case that made the parting visible. Neither engine reaches for a lot here — both have
  a deterministic rung available, and for two years the rungs disagreed:

    LH  (before 2026-08-19)  TOTAL MARGIN.  Birch +3 (6-3 over Cedar, 5-4 over Dogwood,
                             4-5 to Alder) beats Alder +1 (5-4, 5-4, 4-5) -> BIRCH.
    BV                       HEAD-TO-HEAD.  Alder and Birch played each other and Alder won
                             it 5-4 -> ALDER.

  Ranked Robin's published protocol settles which of those is the method's own answer, and
  it is not the one this engine was giving. The 1st Degree tiebreaker declares the tied
  candidates FINALISTS and elects the one with the greatest sum of win margins over THE
  OTHER FINALISTS — with exactly two finalists that sum is a single number, their own
  head-to-head. Total margin over the whole field is the 2nd Degree, reached only when the
  finalists are level against each other. So BetterVoting's rung was right and the engine's
  was one rung too low; the engine was corrected on 2026-08-19 and now elects ALDER too.
  pref_voting's independent Copeland still declines to break the tie at all, returning the
  leader set {Alder, Birch} — the honest position for a library that implements the tally
  and not the tiebreak. Read the full ladder in
  05_Ranked_Robin/03_Criteria/rr_tiebreaks/degrees_of_ties.md.

  Note also that the whole field is one Smith set: Alder>Birch>Dogwood>Alder cycles, so
  there is no Condorcet winner and the Copeland leaders understate how wide the contention
  really is.

  The election was minted to expose a BetterVoting DISPLAY defect, and it does: the results
  page reads "Alder wins!" while the star and the gold table row sit on Birch, because the
  page highlights by row position while the winner is decided by the ladder. Filed as
  bettervoting#1480. Do not read the star on that page as BV's answer — BV's answer is
  Alder, stated in the heading and in the export's `elected`.

  Lesson: 05_Ranked_Robin/03_Criteria/rr_tiebreaks/bv2270_8h4bvh_head_to_head_vs_margin.md
  Live results: https://bettervoting.com/8h4bvh/results

# Machine-readable BV fields — build_bv_registry.py reads these.
bv_test_id: BV2270
bv_election_id: 8h4bvh
bv_results_url: https://bettervoting.com/8h4bvh/results

voting_method: RankedRobin   # = RCV-RR / Copeland — round-robin on a ranked ballot
num_winners: 1
# No lot_numbers: neither engine reaches a lot rung here. Both separate the two leaders on
# their head-to-head — the 1st Degree. The tiebreak ORDER BV recorded
# (tieBreakOrder: Cedar 0, Birch 1, Dogwood 2, Alder 3) decides nothing about the winner —
# it only decides the ROW ORDER on the results page, which is what makes the display defect
# visible. tieBreakType in the export is "none".
# Records: Birch 2-1-0 Copeland 2 margin +3; Alder 2-1-0 Copeland 2 margin +1;
#   Dogwood 1-2-0 Copeland 1 margin -1; Cedar 1-2-0 Copeland 1 margin -3.
#   Pairwise: Alder>Birch 5-4, Alder>Cedar 5-4, Dogwood>Alder 5-4, Birch>Cedar 6-3,
#   Birch>Dogwood 5-4, Cedar>Dogwood 5-4. Smith set = all four.
#   LH -> Alder (1st Degree; was Birch on the pre-2026-08-19 total-margin rung).
#   BV -> Alder (head-to-head). pref_voting -> {Alder, Birch}, declining to choose.
#
# The three mirror-pair ballots (Alder>Birch>Cedar>Dogwood plus its exact reverse) were
# cast on the live election to re-roll BV's display shuffle, which re-seeds on every vote.
# They cancel on all six matchups, so the tally below is identical to the three-ballot
# original: every margin, every Copeland score and both engines' winners are unchanged.
ballots: |-
  4:Alder>Birch>Cedar>Dogwood
  3:Dogwood>Cedar>Birch>Alder
  1:Birch>Cedar>Dogwood>Alder
  1:Dogwood>Alder>Birch>Cedar

expected_winners:
  - Alder

# file: bv2270_8h4bvh_head_to_head_vs_margin.yaml
