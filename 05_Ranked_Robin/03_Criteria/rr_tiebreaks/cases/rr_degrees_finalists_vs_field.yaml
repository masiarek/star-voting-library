election_title: "The 1st Degree counts the finalists only — and it elects someone else"
scenario_description: >-
  Twenty-six neighbours rank four candidates for a community board, and three of
  them — Alma, Ben and Cleo — cycle: Alma beats Ben, Ben beats Cleo, Cleo beats
  Alma. All three finish on two matchup wins, so all three are FINALISTS. Dane
  loses every matchup and is not one.

  Ranked Robin's tie-breaking protocol says what to do, and this file is here
  because the two obvious readings of "greatest sum of win margins" give
  different winners:

    1st Degree — margins over THE OTHER FINALISTS.  Alma +2, Cleo 0, Ben -2.
                 Alma is elected.
    2nd Degree — margins over ALL CANDIDATES.       Ben +24, Alma +12, Cleo +10.
                 Ben would be elected.

  Ben's +24 is almost entirely one number: he beats Dane 26-0, while Alma and
  Cleo only beat Dane 18-8. So under the second reading the winner is decided by
  how hard each finalist beat a candidate who was never in contention — a
  candidate the finalists' own tie has nothing to do with. That is why the
  protocol asks the finalists-only question FIRST and keeps the whole-field
  question in reserve for finalists who are level against each other.

  This engine got that order wrong until 2026-08-19: it had no finalists-only
  rung at all and ranked ties on total margin, so it elected Ben on these
  ballots. BetterVoting gets it wrong the other way — it has no margins rung of
  any kind, so a three-way tie falls straight to its random rung and the winner
  tracks the order the candidates were listed in (filed as bettervoting#1469).
  Companion: rr_degrees_three_way_cycle.yaml, the minimal version of the same
  BetterVoting failure. Lesson: degrees_of_ties.md
voting_method: RankedRobin
num_winners: 1
# Cycle among the leaders: Alma>Ben 18-8, Ben>Cleo 17-9, Cleo>Alma 17-9.
#   Everyone beats Dane, but by very different margins: Ben 26-0, Alma 18-8,
#   Cleo 18-8. Copeland: Alma 2, Ben 2, Cleo 2, Dane 0.
#   1st Degree (finalists only): Alma +2, Cleo 0, Ben -2  -> Alma.
#   2nd Degree (whole field):    Ben +24, Alma +12, Cleo +10 -> Ben, if reached.
ballots: |-
  8:Ben>Dane>Cleo>Alma
  9:Cleo>Alma>Ben>Dane
  9:Alma>Ben>Cleo>Dane

expected_winners:
  - Alma

# file: rr_degrees_finalists_vs_field.yaml
