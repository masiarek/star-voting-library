election_title: "BV2262 — nine candidates, a nine-way dead heat: the recorded tiebreak still pins the winner"
scenario_description: >-
  The scale check on BV2261. Nine club members sit around a table and all nine are
  candidates for chair; each member ranks themselves first and then continues
  clockwise, so the nine ballots are nine rotations of one order. That construction
  makes the deadlock exact rather than fiddled: for two candidates at cyclic distance
  d, exactly 9-d voters prefer the earlier one, so every member beats the four who
  follow them and loses to the four who precede them. All nine finish 4-4-0 on a
  Copeland score of 4, and every one of them nets a margin of exactly zero (+7, +5,
  +3, +1 against -7, -5, -3, -1). It is a nine-way Condorcet cycle — no drawn matchup
  anywhere, and nothing in the ballots that separates anybody.

  So every deterministic rung ties, and BetterVoting's head-to-head rung cannot even
  apply (it is 2-way only, and nine are tied). Both engines reach their rung of last
  resort, and the question is what survives in the export. Answer: the whole nine-deep
  order. BV recorded tieBreakType "random", a nine-long `perm`, tieBreakOrder 0..8 on
  the nine tied candidates, and `other[]` listing the eight losers in that same order.
  Its winner, Boris, is sixth in the candidate list — this shuffle is not a no-op.

  This file pins lot_numbers to that recorded perm, so LH's lot rung replays BV's draw
  and elects Boris too. Independently, tools_adam/bv_replay_tiebreak.py recomputes the
  same perm from (9 ballots + raceId) alone — no ballot content — which is the sharp
  version of the point: BV's order is RECORDED and reproducible, but never DERIVABLE
  from how anyone voted. Companion at three candidates:
  bv2261_y2fbpc_tiebreak_recorded_{draws,cycle}.yaml. Lesson:
  05_Ranked_Robin/03_Criteria/rr_tiebreaks/bv2262_2gvwr9_nine_way_dead_heat.md
  Live results: https://bettervoting.com/2gvwr9/results

# Machine-readable BV fields — build_bv_registry.py reads these.
bv_test_id: BV2262
bv_election_id: 2gvwr9
bv_results_url: https://bettervoting.com/2gvwr9/results

voting_method: RankedRobin   # = RCV-RR / Copeland — round-robin on a ranked ballot
num_winners: 1
# Pinned to BetterVoting's recorded random perm for this race. Note it is a real
# shuffle — Boris is 2nd in the candidate list and 1st here, Alice drops to 6th — so
# matching BV's winner is a genuine test rather than an artifact of list order.
lot_numbers: [Boris, Felix, Greta, Dmitri, Carmen, Alice, Ivan, Elena, Hugo]
# Records: all nine 4-4-0, Copeland 4, margin +0. LH ladder: Copeland tie -> margin
#   tie -> lot (= BV's perm) -> Boris. BV: tieBreakType "random", perm as above ->
#   Boris. pref_voting's independent Copeland returns the nine-way leader set and
#   declines to choose, consistent with both. Third-party replay of the shuffle:
#   python3 STARVote_LH_tabulation_engine/tools_adam/bv_replay_tiebreak.py \
#     05_Ranked_Robin/03_Criteria/rr_tiebreaks/cases/bv2262_2gvwr9_nine_way_dead_heat_bv_export.json
ballots: |-
  Alice>Boris>Carmen>Dmitri>Elena>Felix>Greta>Hugo>Ivan
  Boris>Carmen>Dmitri>Elena>Felix>Greta>Hugo>Ivan>Alice
  Carmen>Dmitri>Elena>Felix>Greta>Hugo>Ivan>Alice>Boris
  Dmitri>Elena>Felix>Greta>Hugo>Ivan>Alice>Boris>Carmen
  Elena>Felix>Greta>Hugo>Ivan>Alice>Boris>Carmen>Dmitri
  Felix>Greta>Hugo>Ivan>Alice>Boris>Carmen>Dmitri>Elena
  Greta>Hugo>Ivan>Alice>Boris>Carmen>Dmitri>Elena>Felix
  Hugo>Ivan>Alice>Boris>Carmen>Dmitri>Elena>Felix>Greta
  Ivan>Alice>Boris>Carmen>Dmitri>Elena>Felix>Greta>Hugo

expected_winners:
  - Boris

