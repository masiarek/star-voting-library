election_title: "Clone independence (2/2) — teaming: A runs clones, and hands the win to C"
scenario_description: >-
  The electowiki Ranked Robin clone-independence example, part 2 of 2 (the
  "after"). Same election as part 1, but the A-faction now runs two clones,
  A1 and A2 (voters rank them together, A1>A2, in A's old slot). This "teaming"
  reshapes the field: by absorbing votes the clones push B out of the top tier
  (B falls to 4 wins while A1 and C reach 5), so the finalists are now A1 and C
  rather than A, B and C. Running clones therefore CHANGED THE OUTCOME — part 1
  ends in a lot between A and B, part 2 elects a single winner outright — which
  is a clone-independence (crowding) failure, and it needs the top cycle to work.
  But it backfires on the faction that ran the clones. Ranked Robin's 1st Degree
  tiebreaker compares the finalists only, and C beats A1 head-to-head 21-12, so
  C wins. NOTE the tiebreak sensitivity, which is the real lesson here: the
  teaming ATTACK only succeeds against an engine that reaches for total margin
  over the whole field first (A1 +134 vs C +104) — this engine did until
  2026-08-19, and electowiki's own worked example of teaming asserts the same
  A1 win, which its own 1st Degree rule does not support. See
  05_Ranked_Robin/03_Criteria/rr_tiebreaks/degrees_of_ties.md. Companion: clone_teaming_01_pre.yaml · lesson:
  05_Ranked_Robin/01_Learn/rr_clone_independence.md
paradoxes: [clone-teaming]
voting_method: RankedRobin
num_winners: 1
lot_numbers: [A1, A2, B, C, D, E, F]
# After cloning: A1 and C tie at 5 wins (cycle A1>B>C>A1; C beats A1 21-12).
#   1st Degree = the finalists' own head-to-head -> C. B drops to 4 wins and is
#   no longer a finalist, so the clones DID change the outcome (part 1 ends in a
#   lot) -- but they handed it to C. Total margin (A1 +134 vs C +104) is the 2nd
#   Degree and would elect A1; that is the rung this engine used before
#   2026-08-19, and the only rung the teaming attack beats.
ballots: |-
  12:A1>A2>B>C>D>E>F
  11:B>C>A1>A2>D>E>F
  10:C>A1>A2>B>D>E>F

expected_winners:
  - C

