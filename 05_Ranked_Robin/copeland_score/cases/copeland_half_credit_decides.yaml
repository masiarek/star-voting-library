election_title: "Ranked Robin — the half-point for a draw decides the election (LH-only)"
election_description: >-
  30 ranked ballots, 5 candidates: the chess club elects its president. This case
  isolates the ONE thing that separates the Copeland score from a raw win count —
  the half-credit a drawn matchup earns.

  Alice finishes 2-1-1 — winning two head-to-heads, DRAWING one, and outright LOSING
  to Carmen. Carmen and Dmitri each finish 2-2-0 and Bruno 1-1-2, so three rivals
  match Alice on raw wins, and one of them won their face-to-face matchup. Yet Alice
  wins, because Copeland scores a draw as half a win: Alice 2 + 0.5 = 2.5 against
  three candidates on exactly 2.0. The half-point IS the margin of victory.

  Two lessons ride on that. First, "most head-to-head wins" is a shorthand, not the
  rule — the rule is the Copeland score, and the two come apart the moment any
  matchup is drawn. Second, Ranked Robin does not promise to elect someone who beat
  everybody; when nobody beats everybody, it elects the best overall round-robin
  record, and that winner may well have lost a match.

  LH-ONLY ON PURPOSE. Nothing here is un-freezable — the result is fully
  deterministic (Alice is the unique Copeland leader, so no tiebreak is reached) —
  but the case is a pure engine-mechanics illustration with no BetterVoting election
  behind it. Compare the sibling case dead_heat_lot_tiebreak, where the half-credit
  produces a TIE and the lot ladder has to finish the job; here it produces a
  decisive, outright winner.

voting_method: RankedRobin
num_winners: 1
lot_numbers: [Alice, Bruno, Carmen, Dmitri, Elena]
lh_only_reason: "A pure engine-mechanics illustration of the Copeland half-credit; deterministic and reproducible, but with no BetterVoting election behind it."
options:
  show_matrix: true
ballots: |-
  9:Alice>Elena>Dmitri>Bruno>Carmen
  8:Carmen>Bruno>Alice>Elena>Dmitri
  7:Dmitri>Bruno>Carmen>Alice>Elena
  6:Carmen>Alice>Dmitri>Elena>Bruno

expected_winners:
  - Alice

