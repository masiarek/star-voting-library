  Purple
  Green>Blue>Pink
  Green>Blue>Pink
  Green>Blue>Pink
  Green>Blue>Pink
  Green>Blue>Pink
  Green>Blue>Pink
  Blue>Pink
  Blue>Pink
  Blue>Green>Pink
  Blue>Purple
  Pink>Green>Purple
  Pink>Purple
  Pink

expected_winners:
  - Green   # LH ladder (margin +5); BetterVoting's ladder (head-to-head among the tied pair) elects Green

