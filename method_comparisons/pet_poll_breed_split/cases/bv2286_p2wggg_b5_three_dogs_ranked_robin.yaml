election_title: "BV2286 — Ballot B (three dogs on the paper): Ranked Robin confirms the Labrador"
scenario_description: >-
  Race 7 of 7 in the BV2286 "Three dogs and a cat" election (BetterVoting p2wggg).
  The same sixty ranked ballots as race 4, counted head-to-head instead of by
  elimination. The Labrador wins every one of its four matchups — over the Golden
  Retriever 34-26, the German Shepherd 46-14, the Cat 34-26 and the Parrot 54-6 — for a
  4-0-0 record and an unambiguous Condorcet winner. This race is the answer key for the
  whole election: it names the candidate this electorate most prefers, with no
  elimination order and no runoff to argue about. STAR (race 6) finds it; RCV-IRV
  (race 4) eliminates it in round 3; Choose-One (race 3) elects the Cat, which the
  Labrador beats head-to-head by the same 34-26.
  Live results: https://bettervoting.com/p2wggg/results
