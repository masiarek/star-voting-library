election_title: "BV2286 — Ballot A (one dog on the paper): STAR agrees, Dog again"
scenario_description: >-
  Race 2 of 7 in the BV2286 "Three dogs and a cat" election (BetterVoting p2wggg).
  The same sixty voters and the same three-name ballot as race 1, scored 0-5.
  Scoring Round: Dog 222, Cat 144, Parrot 58. Automatic Runoff: Dog 34, Cat 26,
  no Equal Support. STAR returns the same winner Choose-One did, because with one
  name per family there is nothing for a richer ballot to rescue. This race is the
  control: it is what a demo poll looks like when every method agrees and the
  audience learns nothing about vote splitting. The lesson starts at race 3.
  Live results: https://bettervoting.com/p2wggg/results
