election_title: "BV2286 — Ballot B (three dogs on the paper): Approval elects the Golden Retriever"
scenario_description: >-
  Race 5 of 7 in the BV2286 "Three dogs and a cat" election (BetterVoting p2wggg).
  The same sixty voters, approving every candidate they would be happy with. Because a
  dog voter can approve more than one dog, the three-way split of race 3 simply does
  not occur — the dog side's support adds up instead of dividing. The Golden Retriever
  wins with 34 of 60 (57%): it is the one breed approved by voters from all three dog
  camps, where the Labrador is approved by two of them (26) and the German Shepherd by
  one (8). Cat holds its undivided 26. Approval finds the broadest reach; it does not
  ask which of two candidates more voters actually prefer, which is the job STAR's
  automatic runoff does in race 6 — and there the answer is the Labrador.
  Live results: https://bettervoting.com/p2wggg/results
bv_test_id: BV2286
