<text x="30" y="1504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#000000">This election will use STAR Voting to elect one winner. In STAR</text>
<text x="30" y="1562" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#000000">Voting, the two highest scoring candidates are finalists and your</text>
<text x="30" y="1620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#000000">vote goes to the finalist you prefer. The finalist preferred by the</text>
<text x="30" y="1678" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#000000">most voters wins.</text>
