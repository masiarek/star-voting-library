<text x="30" y="78" font-family="Arial Black, Arial Bold, Helvetica, sans-serif" font-size="66" font-weight="bold" fill="#C0504D">Bloc STAR Voting</text>
<text x="30" y="152" font-family="Arial Black, Arial Bold, Helvetica, sans-serif" font-size="54" font-weight="bold" fill="#000000">This election will elect 3 winners.</text>
<text x="44" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" fill="#000000">•</text>
<text x="84" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" fill="#000000">Give your favorite candidate five stars.</text>
<text x="44" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" fill="#000000">•</text>
<text x="84" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" fill="#000000">Give your last choice zero stars or leave them blank.</text>
<text x="44" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" fill="#000000">•</text>
<text x="84" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" fill="#000000">Equal scores are allowed.</text>
<text x="44" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" fill="#000000">•</text>
<text x="84" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" fill="#000000">Score other candidates as desired.</text>
