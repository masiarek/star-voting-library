<text x="30" y="1578" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#000000">This election will use Bloc STAR Voting to elect 3 winners. In Bloc</text>
<text x="30" y="1636" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#000000">STAR Voting, the two highest scoring candidates are finalists and</text>
<text x="30" y="1694" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#000000">your vote goes to the finalist you prefer. The finalist preferred by</text>
<text x="30" y="1752" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#000000">the most voters wins. This process repeats until all seats have</text>
<text x="30" y="1810" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#000000">been filled.</text>
