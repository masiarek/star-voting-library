[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "starvote"
authors = [
    {name = "Larry Hastings", email = "larry@hastings.org"},
    ]
readme = "README.md"
# Upstream 2.1.6 declares >=3.6; the fork tracks the workspace floor (nothing
# below 3.10 is ever tested here).
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    ]
dynamic = [
    'version',
    'description',
    ]
# Upstream starvote is stdlib-only; the workspace root supplies pyyaml etc.
# for the wrapper and tools. Keep this list empty so the engine's metadata
# matches the pristine upstream claim in FORK_NOTES.md.
dependencies = []

[project.urls]
Source = "https://github.com/larryhastings/starvote/"


[project.optional-dependencies]
reference = [
    "numpy",
    "pandas",
    ]
# Optional: independent cross-check of the ranked-ballot methods (Condorcet /
# IRV / Plurality) against Eric Pacuit's pref_voting library. Powers
# tests/test_pref_voting_crosscheck.py and tools_adam/pref_voting_crosscheck.py.
# Install with:  pip install -e .[crosscheck]   (or  pip install pref_voting)
crosscheck = [
    "pref_voting>=1.18",
    ]
