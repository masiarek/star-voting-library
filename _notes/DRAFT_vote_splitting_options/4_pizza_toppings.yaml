election_title: "OPTION 4 — Pizza toppings: six meats and a mushroom"
scenario_description: |-
  Eight people, one pizza, one topping. Six of the seven options on the board are
  meat, and every meat eater has a different favourite, so each meat collects
  exactly ONE first choice. The two mushroom eaters agree with each other.

  Choose-One elects Mushroom with 2 of 8 (25%) while SIX of the eight (75%)
  wanted meat on the pizza. Under STAR a meat eater scores every meat, the split
  vanishes, and Pepperoni wins. Mushroom finishes LAST of seven on score.

