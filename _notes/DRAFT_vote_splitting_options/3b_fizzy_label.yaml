election_title: "OPTION 3b — the same seven voters, asking about the FIZZY label instead"
scenario_description: |-
  Byte-for-byte the same election as 3_fizzy_or_sweet.yaml. One thing changes:
  the blocs: key now names the four FIZZY drinks instead of the four SWEET ones.

  Fizzy holds 4 of 7 first choices - the identical headcount the sugar grouping
  holds, spread across four candidates the same way. And the engine reports NO
  spoiler, because the fizzy front-runner (Diet Cola) simply won.

  Same ballots. Same winner. Opposite verdict. The difference is not in the
  arithmetic and not in the size of the group - it is in whether the same people
  actually back all of its members. A clone set is made of voters, not of
  categories, and only the ballots can tell you which is which.

blocs:
