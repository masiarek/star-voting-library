election_title: "OPTION 1 — The ice cream counter: seven chocolates and a vanilla"
scenario_description: |-
  Nine people. Eight flavours. Seven of the eight tubs are chocolate in some
  form, and every chocolate lover has a different favourite, so each chocolate
  collects exactly ONE first choice. The two vanilla eaters agree with each
  other.

  Choose-One elects Vanilla with 2 of 9 — twenty-two percent — while SEVEN of
  the nine people (78%) came in wanting chocolate. Nobody's vote was wasted by
  accident and nobody voted strategically; the chocolate side simply had seven
  names to spread nine people's single marks across.

  Under STAR a chocolate lover scores every chocolate, the split vanishes, and
  Milk Chocolate wins the runoff 6-3 with nobody at Equal Support. Vanilla
  finishes DEAD LAST of eight in the scoring round.

blocs:
  Chocolate: [Dark Chocolate, Milk Chocolate, Chocolate Chip, Chocolate Fudge, Rocky Road, Mint Chip, Brownie Batter]

voting_method: STAR
num_winners: 1

ballots: |-
  Dark Chocolate,Milk Chocolate,Chocolate Chip,Chocolate Fudge,Rocky Road,Mint Chip,Brownie Batter,Vanilla
  5,4,2,2,1,1,2,0   # dark chocolate is my favourite
