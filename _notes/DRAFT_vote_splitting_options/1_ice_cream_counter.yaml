  3,4,2,1,5,1,1,0   # rocky road is my favourite
  2,4,2,1,1,5,1,1   # mint chip is my favourite
  3,4,2,3,1,1,5,0   # brownie batter is my favourite
  1,0,0,0,0,1,0,5   # vanilla, please
  1,0,0,0,0,0,0,5   # vanilla, please

expected_winners:
