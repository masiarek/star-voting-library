election_title: "OPTION 2 — The coffee menu: six ways to have espresso with milk, and a drip"
scenario_description: |-
  Eight people, one order for the table, seven drinks on the board. Six of the
  seven are espresso with milk in slightly different proportions — the kind of
  distinction the people who drink them care about and nobody else can see — and
  each has exactly one champion. The two drip drinkers agree.

  Choose-One elects Drip Coffee with 2 of 8 (25%) while SIX of the eight (75%)
  wanted espresso with milk.

  Under STAR the milk drinkers score all six, the split vanishes, and Latte wins
  the runoff 5-3. Drip Coffee finishes LAST of seven in the scoring round.

blocs:
  Espresso and milk: [Latte, Cappuccino, Flat White, Macchiato, Mocha, Cortado]

voting_method: STAR
num_winners: 1

ballots: |-
  Latte,Cappuccino,Flat White,Macchiato,Mocha,Cortado,Drip Coffee
  5,4,3,2,2,2,0   # latte, please
  4,5,3,2,1,2,0   # cappuccino, please
  4,3,5,2,1,3,0   # flat white, please
  4,3,3,5,1,3,0   # macchiato, please
  4,3,1,1,5,1,1   # mocha, please
  4,3,3,3,1,5,0   # cortado, please
  1,0,0,0,1,0,5   # just drip coffee
  1,0,0,0,0,0,5   # just drip coffee

expected_winners:
  - Latte

