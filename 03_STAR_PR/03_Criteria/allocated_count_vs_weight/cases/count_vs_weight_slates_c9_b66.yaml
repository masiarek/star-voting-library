election_title: Three slates, five seats — the count-vs-weight fingerprint
scenario_description: >
  A stress profile built to expose how an Allocated Score tabulator accounts
  for the quota: three party-line slates — 41 voters score only A1–A4 at 5,
  19 score only B1–B3, 6 score only C1–C2 — filling five seats. The Hare
  quota is 66/5 = 13.2, and the A slate holds 41/13.2 = 3.11 quotas, so the
  proportional (Hamilton) answer is 3 A seats + 1 B + 1 C — which
  BetterVoting's production tabulator, the published reference
  implementation, and this engine (since the fork's 2026-08-09
  count-vs-weight fix) all elect; confirmed live against bettervoting.com
  on 2026-08-09. Unpatched starvote (upstream issue #20, still open)
  instead elects a FOURTH A — 4-1-0, D'Hondt's answer — because its
  allocation round measures the quota in ballot COUNTS: every A round
  retires 13.2/41 = 32.20% of the A ballots' remaining weight no matter how
  little weight they still carry, so a big slate pays a geometrically
  shrinking price per seat instead of a full quota. Within each slate the
  seat order is lot-decided (the slate's candidates tie every round), which
  is why the lot order is published in this file; the SEAT SPLIT between
  slates is decided by the ballots alone. Full trace and the upstream
  reports: this folder's README.
lot_numbers: [A1, A2, A3, A4, B1, B2, B3, C1, C2]
voting_method: allocated
num_winners: 5
ballots: |-
  Count:A1,A2,A3,A4,B1,B2,B3,C1,C2
  41:5,5,5,5,0,0,0,0,0   # slate A — 3.11 quotas
  19:0,0,0,0,5,5,5,0,0   # slate B — 1.44 quotas
  6:0,0,0,0,0,0,0,5,5    # slate C — 0.45 quotas
expected_winners: [A1, A2, A3, B1, C1]

