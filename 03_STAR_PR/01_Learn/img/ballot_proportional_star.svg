<text x="30" y="1516" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#000000">Winners in Proportional STAR Voting are selected in rounds. Each</text>
<text x="30" y="1574" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#000000">round elects the candidate with the highest total score and then</text>
<text x="30" y="1632" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#000000">designates that candidate's strongest supporters as represented.</text>
<text x="30" y="1690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#000000">Subsequent rounds include all voters who are not yet represented.</text>
