<text x="30" y="152" font-family="Arial Black, Arial Bold, Helvetica, sans-serif" font-size="54" font-weight="bold" fill="#000000">This election will elect 3 winners.</text>
<text x="30" y="204" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" fill="#000000">Score all candidates from 0–5 stars. Those you leave blank</text>
<text x="30" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" fill="#000000">receive a zero. If you don't have a preference you can give</text>
<text x="30" y="328" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" fill="#000000">candidates the same scores.</text>
